<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>404 — Scam Busters Network</title>
<style>
  :root { --bg:#0a0c10; --red:#b3122b; --red-br:#e01e3c; --text:#fff; --muted:#9aa0b0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:40px; }
  .code { font-size:80px; font-weight:bold; color:var(--red-br); line-height:1; margin-bottom:16px; }
  .msg { font-size:16px; color:var(--muted); margin-bottom:8px; letter-spacing:2px; text-transform:uppercase; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:40px; }
  a { color:var(--red-br); text-decoration:none; border:1px solid var(--red);
    padding:12px 24px; font-size:12px; letter-spacing:2px; text-transform:uppercase;
    transition:background .15s; }
  a:hover { background:var(--red); color:#fff; }
  .bar { position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--red),var(--red-br)); }
</style>
</head>
<body>
<div class="bar"></div>
<div class="code">404</div>
<div class="msg">Page Not Found</div>
<div class="sub">This lead went cold. Let's get you back on track.</div>
<a href="/">Return to SBN HQ</a>
</body>
</html>
